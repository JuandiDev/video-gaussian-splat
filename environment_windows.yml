name: gaussian_splatting
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - plyfile
  - tqdm
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=11.8
  - llvm-openmp
  - vs2015_runtime
  - numpy>=1.24,<2
  - pip:
      - opencv-python
      - joblib
      - submodules/diff-gaussian-rasterization
      - submodules/simple-knn
      - submodules/fused-ssim
